name: Register for the workshop
description: Enroll your GitHub account in the active Agentic 101 MCP workshop
title: "Workshop registration"
body:
  - type: markdown
    attributes:
      value: |
        Submit this issue while signed in with the GitHub account you will use
        for the workshop. Registration uses the author of the issue; you do not
        need to enter your username.
  - type: checkboxes
    id: enrollment
    attributes:
      label: Enroll this account
      options:
        - label: Add the GitHub account submitting this issue to the workshop
          required: true
